    <script type="application/json" id="ae22b022-f66e-4b5b-8b5f-51eab483b500">
      {"13dd7912-7e1c-4f92-a79d-cfae0f3f18de":{"version":"3.10.0","title":"Bokeh Application","config":{"type":"object","name":"DocumentConfig","id":"p2311","attributes":{"notifications":{"type":"object","name":"Notifications","id":"p2312"}}},"roots":[{"type":"object","name":"Column","id":"p2310","attributes":{"styles":{"type":"map","entries":[["padding","8px 18px 24px 18px"],["background","#f9f9f7"],["font-family","system-ui, sans-serif"]]},"sizing_mode":"stretch_width","children":[{"type":"object","name":"Div","id":"p1006","attributes":{"styles":{"type":"map","entries":[["margin-bottom","6px"]]},"sizing_mode":"stretch_width","text":"&lt;div style=\"font:600 20px system-ui, sans-serif;color:#0b0b0b;margin:8px 0 0 0\"&gt;Forecast error and trading value JAN25&lt;/div&gt;&lt;div style=\"color:#52514e;font-size:13px;margin-top:4px;max-width:1100px;line-height:1.45\"&gt;Household MILP (J = 4, R_cell = 12,000) re-planned every 5 minutes on a 24 h horizon over January 2025. How much trading value is lost as the price or household forecast gets worse, for synthetic error of a controlled size and for the real forecasters.&lt;/div&gt;"}},{"type":"object","name":"Div","id":"p1007","attributes":{"sizing_mode":"stretch_width","text":"&lt;div style=\"font:600 15px system-ui, sans-serif;color:#0b0b0b;margin-top:18px;padding-top:10px;border-top:1px solid #e1e0d9\"&gt;Forecasts compared&lt;/div&gt;&lt;div style=\"color:#52514e;font-size:12px;margin-top:2px;max-width:1100px;line-height:1.45\"&gt;Every run is the same controller given a different forecast of one input. The price of the interval being dispatched is always the actual price (AEMO publishes it before the interval starts); everything further ahead is forecast. The household's net-local power is forecast for every interval, including the current one.&lt;/div&gt;"}},{"type":"object","name":"Div","id":"p1008","attributes":{"sizing_mode":"stretch_width","text":"&lt;table style=\"font:12px/1.45 system-ui, sans-serif;border-collapse:collapse;max-width:1100px;margin-top:4px\"&gt;&lt;tr&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#898781\"&gt;Price&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#0b0b0b;font-weight:600\"&gt;&lt;span style=\"display:inline-block;width:10px;height:10px;border-radius:2px;background:#5f5e59;margin-right:7px\"&gt;&lt;/span&gt;Synthetic price noise&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;color:#52514e\"&gt;The actual price path plus a random error path, added to asinh(price/100): roughly additive near $0 and proportional on high prices, so a spike keeps its timing and only its size is wrong. The error is smooth along the horizon (AR(1), \u03c1 = 0.95 per 5 min), near zero for the next interval and growing as \u221alead to \u03c3_max at 24 h ahead. A fresh path is drawn at every re-plan, so the error has no bias and does not persist from one plan to the next. Levels: \u03c3_max = 0.25, 0.5, 1, 2.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#898781\"&gt;Price&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#0b0b0b;font-weight:600\"&gt;&lt;span style=\"display:inline-block;width:10px;height:10px;border-radius:2px;background:#1baf7a;margin-right:7px\"&gt;&lt;/span&gt;Seasonal naive&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;color:#52514e\"&gt;The price in the same half-hour slot on the previous day.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#898781\"&gt;Price&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#0b0b0b;font-weight:600\"&gt;&lt;span style=\"display:inline-block;width:10px;height:10px;border-radius:2px;background:#2a78d6;margin-right:7px\"&gt;&lt;/span&gt;AEMO pre-dispatch&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;color:#52514e\"&gt;The latest AEMO pre-dispatch price run published before the forecast is issued (half-hourly), filled with the seasonal naive beyond the end of the run.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#898781\"&gt;Price&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#0b0b0b;font-weight:600\"&gt;&lt;span style=\"display:inline-block;width:10px;height:10px;border-radius:2px;background:#eb6834;margin-right:7px\"&gt;&lt;/span&gt;LSTM&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;color:#52514e\"&gt;A 2-layer LSTM over the previous 7 days of price, system demand and calendar features, predicting the next 48 half-hour prices in asinh(price/100) with Huber loss. Trained on 2015\u20132023, validated on 2024.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#898781\"&gt;Household&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#0b0b0b;font-weight:600\"&gt;&lt;span style=\"display:inline-block;width:10px;height:10px;border-radius:2px;background:#5f5e59;margin-right:7px\"&gt;&lt;/span&gt;Synthetic load noise&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;color:#52514e\"&gt;The actual net-local power plus an error path of the same shape, added in kW. Levels: \u03c3_max = 0.5, 1, 2, 3 kW.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#898781\"&gt;Household&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;white-space:nowrap;color:#0b0b0b;font-weight:600\"&gt;&lt;span style=\"display:inline-block;width:10px;height:10px;border-radius:2px;background:#eda100;margin-right:7px\"&gt;&lt;/span&gt;7-day load profile&lt;/td&gt;&lt;td style=\"padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px solid #e1e0d9;color:#52514e\"&gt;Net-local power forecast as the mean of the same 5-minute slot over the previous 7 days. Every real price forecaster uses it for the household, so their value lost is measured against perfect price with this profile and is the cost of the price forecast alone.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;"}},{"type":"object","name":"Div","id":"p1009","attributes":{"sizing_mode":"stretch_width","text":"&lt;div style=\"font:600 15px system-ui, sans-serif;color:#0b0b0b;margin-top:18px;padding-top:10px;border-top:1px solid #e1e0d9\"&gt;Value lost by run&lt;/div&gt;&lt;div style=\"color:#52514e;font-size:12px;margin-top:2px;max-width:1100px;line-height:1.45\"&gt;Net profit given up against the reference that isolates each forecast: perfect foresight for the synthetic runs and for the 7-day load profile, perfect price with the 7-day load profile for the real price forecasters (so their bars are the cost of the price forecast alone). Grey bars are synthetic noise, coloured bars are the real forecasters*.&lt;/div&gt;"}},{"type":"object","name":"Row","id":"p1086","attributes":{"sizing_mode":"stretch_width","children":[{"type":"object","name":"Figure","id":"p1014","attributes":{"height":298,"sizing_mode":"stretch_width","x_range":{"type":"object","name":"DataRange1d","id":"p1016","attributes":{"start":0,"end":65.25582746752296}},"y_range":{"type":"object","name":"FactorRange","id":"p1013","attributes":{"factors":[ a real forecaster lose more or less than random error of the same size? The grey curve is the synthetic runs: value lost (y) against forecast MAE (x). Each diamond is a real forecaster. A diamond above the curve loses more than its error size explains; below, less. The y values are identical in all three panels of a row. Only x changes: the MAE of the forecast for the next interval, for 1 h ahead, or averaged over the 24 h horizon. That matters because synthetic error is small at short leads and large at long ones while real error is nearly flat (section 1), so the verdict depends on the lead time used to match them. Matched on the 24 h average, the LSTM, naive and load profile sit above the curve and AEMO below it. Matched at 1 h or at the next interval, every real price forecaster sits far below the curve: it is as wrong at short leads as the heaviest synthetic noise but loses a fraction as much. The load profile's error in the committed interval (1.18 kW) is beyond anything the synthetic runs reach (0.14 kW), so it cannot be placed on that curve.&lt;/div&gt;"}},{"type":"object","name":"Row","id":"p1783","attributes":{"sizing_mode":"stretch_width","children":[{"type":"object","name":"Figure","id":"p1571","attributes":{"height":320,"sizing_mode":"stretch_width","x_range":{"type":"object","name":"DataRange1d","id":"p1572","attributes":{"start":-3.4849804985288007,"end":116.1660166176267}},"y_range":{"type":"object","name":"DataRange1d","id":"p1573","attributes":{"start":-1.2429681422385326,"end":31.074203555963315}},"x_scale":{"type":"object","name":"LinearScale","id":"p1581"},"y_scale":{"type":"object","name":"LinearScale","id":"p1582"},"title":{"type":"object","name":"Title","id":"p1574","attributes":{"text":"Price: Next interval (5 min ahead)","text_color":"#0b0b0b","text_font":"system-ui, sans-serif"}},"outline_line_color":null,"renderers":[{"type":"object","name":"GlyphRenderer","id":"p1600","attributes":{"data_source":{"type":"object","name":"ColumnDataSource"
